name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.99.1 fmt --all -- --check
      - name: Clippy
        run: cargo +1.99.1 clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo +1.99.1 test --locked --lib --bins

  linux-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build static Linux binary
        run: |
          cargo +1.99.1 build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/sync-pg2ch dist/
          strip dist/sync-pg2ch
          cd dist
          sha256sum sync-pg2ch > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sync-pg2ch-linux-x86_64-musl
          path: dist/
          retention-days: 30

  compatibility:
    name: PostgreSQL ${{ matrix.postgres.variant }} and ClickHouse ${{ matrix.clickhouse.version }} LTS
    runs-on: ubuntu-24.04
    needs: linux-binary
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres:
          - variant: "14"
            image: postgres:14.24-bookworm@sha256:a389ed49344afc8f4444efd4eb512965df07aaa6ed84b239b54a23246e9fe347
            postgis: "false"
          - variant: "14 + PostGIS 3.6"
            image: postgis/postgis:14-3.6@sha256:fdf13349aac39b694214d1f323eab3b9ae9a624e2efb582a4c8d3debb1d0b817
            postgis: "true"
        clickhouse:
          - version: "25.8"
            image: clickhouse/clickhouse-server:25.8.23.13@sha256:f58a9d341fabdb20a9c2e98bbb595f7566103f762ef62be0d4f283e0832869fa
          - version: "26.8"
            image: clickhouse:26.8.36.3-jammy@sha256:1201467edf24c3a40c5670aceaece9b51479fbd65e8aeea22e246d5816a322ea
    services:
      postgres:
        image: ${{ matrix.postgres.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-pass
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      clickhouse:
        image: ${{ matrix.clickhouse.image }}
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: test-pass
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123/tcp
          - 8443/tcp
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "clickhouse-client --user default --password test-pass --query 'SELECT 1'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      CH_USER: default
      CH_PASSWORD: test-pass
      TEST_POSTGIS: ${{ matrix.postgres.postgis }}
      TEST_ARTIFACTS: artifacts
      SYNC_PG2CH_TEST_BINARY: ${{ github.workspace }}/dist/sync-pg2ch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sync-pg2ch-linux-x86_64-musl
          path: dist/
      - name: Verify binary checksum
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          chmod +x sync-pg2ch
      - name: Set service endpoints
        env:
          TEST_PG_URL: postgres://postgres:test-pass@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable
          TEST_CH_URL: http://localhost:${{ job.services.clickhouse.ports['8123'] }}
        run: |
          printf 'PG_URL=%s\n' "$TEST_PG_URL" >> "$GITHUB_ENV"
          printf 'CH_URL=%s\n' "$TEST_CH_URL" >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Record service images
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CH_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          mkdir -p artifacts
          docker inspect --format '{{.Config.Image}} {{.Image}}' "$PG_CONTAINER" "$CH_CONTAINER" > artifacts/images.txt
      - name: Run compatibility matrix
        run: cargo +1.99.1 test --locked --features integration --test integration -- --nocapture
      - name: Verify PostgreSQL Unix socket connection
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CH_CONTAINER: ${{ job.services.clickhouse.id }}
        run: bash tests/fixtures/socket-smoke.sh
      - name: Configure TLS services
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CH_CONTAINER: ${{ job.services.clickhouse.id }}
          TEST_PG_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: bash tests/fixtures/configure-tls.sh
      - name: Verify trusted, untrusted, and mismatched TLS certificates
        run: cargo +1.99.1 test --locked --features integration --test integration tls_certificate_validation -- --ignored --nocapture
      - name: Collect logs
        if: always()
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          CH_CONTAINER: ${{ job.services.clickhouse.id }}
        run: |
          mkdir -p artifacts
          docker logs "$PG_CONTAINER" > artifacts/postgres.log 2>&1
          docker logs "$CH_CONTAINER" > artifacts/clickhouse.log 2>&1
          docker cp "$CH_CONTAINER:/var/log/clickhouse-server/clickhouse-server.err.log" artifacts/clickhouse-server.err.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-ch-${{ matrix.clickhouse.version }}-postgis-${{ matrix.postgres.postgis }}
          path: artifacts/
          retention-days: 7
