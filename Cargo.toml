[package]
name = "sync-pg2ch"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Read-only PostgreSQL to ClickHouse schema compatibility diff"

[features]
default = []
integration = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clickhouse = { version = "0.15.3", features = ["rustls-tls-ring", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "1.2"
url = "2"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "integration"
required-features = ["integration"]

[lints.rust]
unsafe_code = "forbid"
